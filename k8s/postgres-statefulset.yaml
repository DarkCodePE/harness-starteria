apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: starteria-db
  namespace: starteria
  labels:
    app: starteria-db
spec:
  serviceName: starteria-db
  replicas: 1
  selector:
    matchLabels:
      app: starteria-db
  template:
    metadata:
      labels:
        app: starteria-db
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "starteria_db"
        - name: POSTGRES_USER
          value: "starteria"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: starteria-db-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
