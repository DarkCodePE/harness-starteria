apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: starteria
  labels:
    app: cloudflared-tunnel
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloudflared-tunnel
  template:
    metadata:
      labels:
        app: cloudflared-tunnel
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2000"
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.9.3
        # Tunnel is remotely managed from Cloudflare Zero Trust dashboard
        # (config_src=cloudflare). TUNNEL_TOKEN below identifies the tunnel;
        # ingress + DNS are configured via the dashboard, not via a local config file.
        # --metrics enables the :2000 endpoint that the readiness/liveness probes hit.
        # Pinned version + --no-autoupdate: upgrades ship through a reviewed diff.
        args:
          - "tunnel"
          - "--no-autoupdate"
          - "--metrics"
          - "0.0.0.0:2000"
          - "run"
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-token
              key: token
        ports:
        - name: metrics
          containerPort: 2000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        # /ready returns 200 only while at least one connection to the Cloudflare
        # edge is registered. A TCP check on :2000 kept a pod with a revoked token
        # "Running 1/1" for hours; this one marks it unready and restarts it.
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /ready
            port: metrics
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 120
