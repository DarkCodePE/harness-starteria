apiVersion: apps/v1
kind: Deployment
metadata:
  name: starteria-backend
  namespace: starteria
  labels:
    app: starteria-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: starteria-backend
  template:
    metadata:
      labels:
        app: starteria-backend
    spec:
      containers:
      - name: backend
        image: orlandogtp/starteria-backend:v2.0.2
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        envFrom:
        # Secret synced by .github/workflows/cd.yml at deploy time.
        # Provides: DATABASE_URL, JWT_SECRET, AI_SERVICE_TOKEN, AI_SERVICE_URL, BRIDGE_SHARED_SECRET.
        - secretRef:
            name: starteria-backend-secrets
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: JWT_EXPIRES_IN
          value: "15m"
        - name: JWT_REFRESH_EXPIRES_IN
          value: "7d"
        - name: CORS_ORIGIN
          value: "https://starter-ia.com"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
