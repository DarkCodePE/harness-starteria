# Cloudflare Tunnel Token Secret
#
# DO NOT apply this file directly. The token must not be stored in version control.
#
# The CD pipeline (.github/workflows/cd.yml, step "Sync Kubernetes secrets") owns
# this secret: it writes secret/cloudflared-token from the GitHub secret
# CLOUDFLARE_TUNNEL_TOKEN and restarts cloudflared when the value changed.
#
# To set or rotate the token:
#   1. Cloudflare Zero Trust -> Networks -> Tunnels -> your tunnel -> Refresh token
#   2. gh secret set CLOUDFLARE_TUNNEL_TOKEN     (prompts; never paste it in a chat)
#   3. Rerun the CD workflow
#
# Until CLOUDFLARE_TUNNEL_TOKEN exists in GitHub, the CD preflight requires a
# manually created secret instead:
#
#   kubectl create secret generic cloudflared-token \
#     -n starteria \
#     --from-literal=token=YOUR_CLOUDFLARE_TUNNEL_TOKEN
#
# To verify the tunnel is connected (not just the pod running):
#   kubectl -n starteria logs deploy/cloudflared-tunnel | grep "Registered tunnel connection"
