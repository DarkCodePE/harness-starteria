# Local-only override (no commitear). El host port 8001 está ocupado por un
# proceso ajeno (linkedin-scrape). El E2E no necesita ai-service expuesto en el
# host: el backend lo alcanza por la red interna (http://ai-service:8001).
# !override reemplaza la lista de ports (en vez de concatenarla) → sin binding host.
services:
  ai-service:
    ports: !override []
    # Local/e2e-only: extracción PDF determinista (sin LLM en vivo) para que el smoke de
    # referencia sea reproducible. Nunca definir en producción.
    environment:
      PDF_EXTRACT_STUB: "true"
  # Local/e2e-only: saca del waitlist a los usuarios auto-registrados para que la suite
  # e2e (register → login) obtenga token. Nunca definir esta variable en producción.
  backend:
    environment:
      AUTH_DISABLE_WAITLIST: "true"
