schema_version: "1.0"
name: autoridad-no-escala-de-mas
description: >
  El caso que impide que el comando sirva para nada. Un cambio que no toca ningún invariante
  tiene que poder avanzar. Un comando que contesta "hace falta un ADR" a todo es tan inútil
  como uno que no lo pide nunca, y se nota mucho más tarde.
tags: [autoridad, producto, no-escala]

execution:
  prompt: |
    /starteria-harness:starteria-autoridad cambiar el texto del botón de la Pantalla 1 de "Empezar" a "Comenzar"
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

graders:
  - type: regex
    name: no-pide-adr
    pattern: "Requires ADR:\\s*yes"
    flags: i
    match: not_contains

  - type: llm
    name: deja-avanzar-y-dice-contra-que-se-verifica
    criteria: >
      La respuesta dice que el cambio puede avanzar sin ADR. Falla si inventa un conflicto,
      si pide un ADR, o si escala a Core por un cambio de copy. Pasa si además nombra contra
      qué documento se verificaría después, o si dice que el nivel que le tocaría (Experience)
      todavía no existe: las dos son respuestas correctas del contrato.

expected_outcome: >
  Dice que se puede avanzar, sin ADR, y nombra contra qué se verifica después o que el nivel
  que le correspondería no está escrito todavía.
